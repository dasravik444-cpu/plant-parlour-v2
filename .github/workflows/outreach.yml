name: Outreach (e-mail + WhatsApp queue)

# Manual runs only. The hourly outreach now runs on the owner's Android tablet (docs/TABLET.md): GitHub disabled
# Actions on the account on 9 Oct 2026. Don't start this by hand while the tablet runs outreach - two outreach
# memories could e-mail the same lead twice.
# Nothing is sent unless mode is "live" (or the repository variable OUTREACH_LIVE is "true"); see docs/OUTREACH.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (nothing is sent) or live (empty = config / OUTREACH_LIVE variable)"
        default: ""
      max_emails:
        description: "Send at most this many e-mails in this run (testing; empty = normal pacing)"
        default: ""
      maintainer_pubkey:
        description: "Optional: base64 RSA public key - prints an ENCRYPTED copy of the e-mails sent, or in a dry-run of those it would send (quality check)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: outreach-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  outreach:
    if: github.event_name == 'workflow_dispatch' || vars.OUTREACH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PP_STATE_KEY: ${{ secrets.PP_STATE_KEY }}
      PP_SHEET_ID: ${{ secrets.PP_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      OUTREACH_GMAIL_ADDRESS: ${{ secrets.OUTREACH_GMAIL_ADDRESS }}
      OUTREACH_GMAIL_APP_PASSWORD: ${{ secrets.OUTREACH_GMAIL_APP_PASSWORD }}
      # Secrets, not variables: variables are printed in the (public) logs.
      OUTREACH_SENDER_PHONE: ${{ secrets.OUTREACH_SENDER_PHONE }}
      OUTREACH_NOTIFY_EMAIL: ${{ secrets.OUTREACH_NOTIFY_EMAIL }}
      OUTREACH_LIVE: ${{ vars.OUTREACH_LIVE }}
      # The outreach memory is its own encrypted artifact, separate from the lead-generation memory.
      STATE_DIR: outreach-state
      DB_NAME: outreach.sqlite
      ART_NAME: pp-outreach
      PP_OUTREACH_DB: outreach-state/outreach.sqlite
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore outreach state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/state.sh restore
      - name: Outreach run
        run: |
          args=(outreach)
          if [ -n "${{ inputs.mode }}" ]; then args+=(--mode "${{ inputs.mode }}"); fi
          if [ -n "${{ inputs.max_emails }}" ]; then args+=(--max-emails "${{ inputs.max_emails }}"); fi
          OUTREACH_SENT_CSV="$RUNNER_TEMP/sent.csv" python -m leadgen "${args[@]}"
      - name: Encrypted copy of the e-mails sent (maintainer check)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.maintainer_pubkey != ''
        env:
          PUBKEY_B64: ${{ inputs.maintainer_pubkey }}
        run: |
          if [ -f "$RUNNER_TEMP/sent.csv" ]; then SAMPLE_CSV="$RUNNER_TEMP/sent.csv" bash scripts/ci/encrypted_sample.sh; else echo "no e-mails sent"; fi
      - name: Save outreach state (encrypted)
        # Only after a successful restore, so a failed restore never replaces the saved state.
        if: always() && steps.restore.outcome == 'success'
        run: bash scripts/ci/state.sh pack
      - name: Upload encrypted state
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pp-outreach
          path: state-out/pp-state.enc
          retention-days: 90
          if-no-files-found: ignore
