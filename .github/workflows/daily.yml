name: Daily lead generation

# Manual runs only. The daily schedule now runs on the owner's Android tablet (docs/TABLET.md, scripts/tablet/,
# leadgen/tablet.py): GitHub disabled Actions on the account on 9 Oct 2026, and GitHub's free runners are meant for
# building and testing code, not for running the business's daily jobs. Don't start this by hand while the tablet
# runs the campaign: both would work on the same leads with different memories.
# Manual runs: Actions tab > Daily lead generation > Run workflow.
on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Time budget in minutes"
        default: "80"
      target:
        description: "Override the daily lead target (empty = config value)"
        default: ""
      max_searches:
        description: "Limit the number of searches (testing; empty = no limit)"
        default: ""
      use_sheet:
        description: "Write to the Google Sheet"
        type: boolean
        default: true
      persist_state:
        description: "Restore/save the encrypted campaign state (turn off only for throw-away tests)"
        type: boolean
        default: true
      replan:
        description: "Re-plan the area first (needed after changing area or days; found leads are kept)"
        type: boolean
        default: false
      mode:
        description: "Override compliance mode: open-data | hybrid | standard (empty = config value)"
        default: ""
      maintainer_pubkey:
        description: "Optional: base64 RSA public key - prints an ENCRYPTED sample of leads for a quality check"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: leadgen-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.PP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PP_STATE_KEY: ${{ secrets.PP_STATE_KEY }}
      PP_SHEET_ID: ${{ secrets.PP_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
      PYTHONUNBUFFERED: "1"
      PERSIST: ${{ github.event_name != 'workflow_dispatch' || inputs.persist_state }}
      PP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install "duckdb>=1.1" || echo "duckdb unavailable - open-data discovery falls back to OpenStreetMap"
          pip install "curl_cffi>=0.7" || echo "curl_cffi unavailable - falling back to requests"
      - name: Check configuration and secrets
        run: python -m leadgen doctor --secrets-only
      - name: Restore campaign state
        id: restore
        if: env.PERSIST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/state.sh restore
      - name: Re-plan
        if: github.event_name == 'workflow_dispatch' && inputs.replan
        run: python -m leadgen plan --force
      - name: Run daily cycle
        run: |
          args=(run --budget-minutes "${{ inputs.budget_minutes || '80' }}")
          if [ -n "${{ inputs.target }}" ]; then args+=(--target "${{ inputs.target }}"); fi
          if [ -n "${{ inputs.max_searches }}" ]; then args+=(--max-searches "${{ inputs.max_searches }}"); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_sheet }}" != "true" ]; then args+=(--no-sheets); fi
          python -m leadgen "${args[@]}"
      - name: E-mail hunt (leads still without an e-mail)
        # A deeper look (own website again, websites missing from the listing) for leads found without a usable
        # e-mail. Each lead is looked at once; the follow-up runs work through the rest (not the long 06:07 run).
        if: (success() || failure()) && env.PERSIST == 'true' && steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          args=(email-hunt --limit 600 --budget-minutes 15)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_sheet }}" != "true" ]; then args+=(--no-sheets); fi
          python -m leadgen "${args[@]}"
      - name: USP lines for older leads
        # Homepage of leads read before USP lines existed (leads with an e-mail first), once each.
        if: (success() || failure()) && env.PERSIST == 'true' && steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          args=(usp-refresh --limit 400 --budget-minutes 10)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_sheet }}" != "true" ]; then args+=(--no-sheets); fi
          python -m leadgen "${args[@]}"
      - name: Encrypted lead sample (maintainer quality check)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.maintainer_pubkey != ''
        env:
          PUBKEY_B64: ${{ inputs.maintainer_pubkey }}
        run: bash scripts/ci/encrypted_sample.sh
      - name: Save campaign state (encrypted)
        # Only after a successful restore, so a failed restore never replaces the saved state.
        if: always() && env.PERSIST == 'true' && steps.restore.outcome == 'success'
        run: bash scripts/ci/state.sh pack
      - name: Upload encrypted state
        if: always() && env.PERSIST == 'true' && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pp-state
          path: state-out/pp-state.enc
          retention-days: 90
          if-no-files-found: ignore
