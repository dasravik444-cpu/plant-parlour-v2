name: Daily lead generation

# Runs every day by itself once the repository variable PP_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables). A second run in the
# afternoon only does work if the morning run fell short (it exits quickly
# otherwise). Manual runs: Actions tab > Daily lead generation > Run workflow.
on:
  schedule:
    - cron: "37 0 * * *"   # 06:07 IST
    - cron: "37 8 * * *"   # 14:07 IST catch-up
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Time budget in minutes"
        default: "80"
      target:
        description: "Override the daily lead target (empty = config value)"
        default: ""
      max_searches:
        description: "Limit the number of searches (testing; empty = no limit)"
        default: ""
      use_sheet:
        description: "Write to the Google Sheet"
        type: boolean
        default: true
      persist_state:
        description: "Restore/save the encrypted campaign state (turn off only for throw-away tests)"
        type: boolean
        default: true
      replan:
        description: "Re-plan the area first (needed after changing area, days or categories; found leads are kept)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: leadgen-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.PP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PP_STATE_KEY: ${{ secrets.PP_STATE_KEY }}
      PP_SHEET_ID: ${{ secrets.PP_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      PYTHONUNBUFFERED: "1"
      PERSIST: ${{ github.event_name != 'workflow_dispatch' || inputs.persist_state }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-extra.txt || echo "curl_cffi unavailable - falling back to requests"
      - name: Check configuration and secrets
        run: python -m leadgen doctor --secrets-only
      - name: Restore campaign state
        if: env.PERSIST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/state.sh restore
      - name: Re-plan
        if: github.event_name == 'workflow_dispatch' && inputs.replan
        run: python -m leadgen plan --force
      - name: Run daily cycle
        run: |
          args=(run --budget-minutes "${{ inputs.budget_minutes || '80' }}")
          if [ -n "${{ inputs.target }}" ]; then args+=(--target "${{ inputs.target }}"); fi
          if [ -n "${{ inputs.max_searches }}" ]; then args+=(--max-searches "${{ inputs.max_searches }}"); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_sheet }}" != "true" ]; then args+=(--no-sheets); fi
          python -m leadgen "${args[@]}"
      - name: Save campaign state (encrypted)
        if: always() && env.PERSIST == 'true'
        run: bash scripts/ci/state.sh pack
      - name: Upload encrypted state
        if: always() && env.PERSIST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pp-state
          path: state-out/pp-state.enc
          retention-days: 90
          if-no-files-found: ignore
