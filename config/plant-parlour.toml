# Plant Parlour - Kolkata pilot campaign
# Edit this file to change the target area, categories or daily target.
# Secrets (sheet id, Google key) are NOT stored here - see docs/SETUP.md.

[campaign]
id = "plant-parlour-kolkata"
client = "Plant Parlour"
timezone = "Asia/Kolkata"
country = "IN"
language = "en"
region = "in"
# Day 1 of the plan. Leave empty to start on the first run's date.
start_date = ""

[area]
name = "Kolkata"
aliases = ["Calcutta"]        # other names of the city (a profile mentioning them counts as local)
local_landline_prefixes = ["+913"]   # West Bengal landlines; others (e.g. +91 11 Delhi) are flagged as booking-platform lines
center = [22.5726, 88.3639]   # latitude, longitude
radius_km = 100

[plan]
days = 30                # split the circle into 30 daily parts ("auto" = estimate from data)
daily_target = 150       # leads per day (a lead = a relevant business with at least one contact route)
order = "center_out"     # work the dense city centre first, then move outwards
min_cell_km = 1.0        # smallest search square (dense areas)
max_cell_km = 16.0       # largest search square (rural areas)
split_threshold = 60     # split a square while it holds more than this many mapped businesses
finish_scheduled_part = true   # always finish the day's part, even after the target is met

[compliance]
# "open-data" (default): leads come only from openly licensed data - Overture Maps (businesses' own
#   Facebook pages via Meta, Microsoft, Foursquare...; CDLA-Permissive-2.0) and OpenStreetMap - plus each
#   business's own website, crawled openly as "PlantParlourLeadBot" and only where robots.txt allows.
#   Nothing is touched on Google Maps, Google/Yahoo search, Instagram or Facebook. Fully within terms.
# "hybrid": same open-data discovery, but ALSO searches the web (Yahoo) for each business's Instagram/
#   Facebook/LinkedIn and reads Instagram bios. More complete contacts; no Google Maps scraping. The
#   search engines' and Instagram's terms discourage automated access, so this is a grey area.
# "standard": ALSO scrapes Google Maps (ratings, a few more places) and web search. Most complete, but
#   against Google's terms of service. Best run from the tablet (home IP) - Google throttles data-centre
#   IPs like GitHub's. Turn this on only if you, as the owner, accept the terms-of-service tradeoff.
mode = "open-data"

[open_data]
min_confidence = 0.4     # Overture's 0-1 estimate that the place exists; lower = more but staler places
refresh_days = 30        # re-download the area when Overture publishes a newer release (monthly)
exclude_codes = ["internet_cafe", "event_photography_service", "photographer", "party_supply_store", "hostel"]

[discovery]
# standard mode only (open-data mode always uses ["overture", "osm"])
providers = ["gmaps", "places_api", "osm"]   # tried in this order; later ones are fallbacks
max_pages = 3            # Google Maps result pages per search (20 results each)
gmaps_interval_s = 4.0   # polite delay between Google Maps requests
gmaps_jitter_s = 3.0
places_api_daily_cap = 30      # official API calls/day (only if GOOGLE_PLACES_API_KEY is set)
places_api_monthly_cap = 900   # stays under Google's 1,000 free Text Search Enterprise calls/month

[filters]
require_contact = true   # only send businesses with at least one phone/email/WhatsApp/Instagram to the sheet
exclude_closed = true
allow_unmatched_categories = false
# National/international chains buy centrally - poor leads for local plant supply.
exclude_chains = [
  "domino", "pizza hut", "kfc", "mcdonald", "burger king", "subway", "starbucks", "cafe coffee day", "ccd",
  "barista", "costa coffee", "chaayos", "wow! momo", "wow momo", "taco bell", "baskin robbins", "keventers",
  "mad over donuts", "dunkin", "haldiram", "behrouz", "faasos", "oven story", "la pino", "naturals ice cream",
  "the belgian waffle", "theobroma", "chai point", "tim hortons", "krispy kreme", "monginis", "mio amore",
  # hotel networks (OYO's other brands - "SPOT ON 83258 Hotel X" - are recognised automatically)
  "oyo", "fabhotel", "treebo",
  # national interior-design and coworking brands (central purchasing)
  "homelane", "livspace", "designcafe", "awfis", "wework", "regus", "smartworks", "indiqube", "91springboard",
  "cowrks", "innov8",
]
exclude_name_words = []

[enrich]
website = true
max_pages_per_site = 4
social_search = true
social_kinds = ["instagram", "facebook", "linkedin"]
instagram_profile = true
check_email_mx = true
workers = 6
search_interval_s = 4.5
site_interval_s = 2.0

[sheets]
enabled = true
spreadsheet_id = ""      # prefer the PP_SHEET_ID secret/environment variable
leads_tab = "Leads"
plan_tab = "Plan"
report_tab = "Daily Report"
checkpoint_minutes = 20  # also copy new leads to the sheet every N minutes during a run (0 = only at the end)

[runtime]
time_budget_minutes = 80
safety_margin_minutes = 6
use_curl_cffi = true

# ----------------------------------------------------------------------------
# Business categories. `queries` are typed into Google Maps for every search
# square; `match` words are checked against Google's own category labels to
# keep only relevant businesses; `osm` tags are used by the OpenStreetMap
# fallback.
# ----------------------------------------------------------------------------
[[categories]]
key = "cafe"
label = "Cafe"
queries = ["cafe", "coffee shop"]
match = ["cafe", "coffee", "tea house", "tea room", "bakery", "dessert", "patisserie", "bistro", "juice", "ice cream", "bubble tea", "creperie", "chocolate"]
osm = ['["amenity"="cafe"]', '["amenity"="ice_cream"]']
overture = ["cafe", "coffee_shop", "tea_room", "bubble_tea_shop", "smoothie_juice_bar", "bakery", "dessert_shop"]

[[categories]]
key = "restaurant"
label = "Restaurant"
queries = ["restaurant", "rooftop restaurant"]
match = ["restaurant", "dining", "bar", "pub", "lounge", "grill", "biryani", "eatery", "dhaba", "kitchen", "pizzeria", "steakhouse", "buffet", "brewery", "brewpub", "gastropub", "cuisine", "food"]
osm = ['["amenity"="restaurant"]', '["amenity"="bar"]', '["amenity"="pub"]']
overture = ["restaurant", "*_restaurant", "fast_food_restaurant", "casual_eatery", "bar", "lounge"]

[[categories]]
key = "banquet_venue"
label = "Banquet / Event venue"
queries = ["banquet hall", "wedding venue", "event venue"]
match = ["banquet", "wedding", "event venue", "event space", "party hall", "community center", "community centre", "convention", "marriage", "function hall", "auditorium", "conference", "lawn", "party venue"]
osm = ['["amenity"="events_venue"]', '["amenity"="conference_centre"]', '["amenity"="community_centre"]']
overture = ["event_venue", "banquet_hall", "wedding_venue", "convention_center", "party_and_event_planning", "wedding_planning"]
# (Overture files banquet halls and event planners under the same code; names with banquet/hall/bhavan/lawn... go here)

[[categories]]
key = "event_planner"
label = "Event planner / Decorator"
queries = ["event management company", "wedding planner", "event decorator"]
match = ["event", "wedding planner", "wedding service", "planner", "decorator", "decoration", "party planner", "party equipment", "caterer", "catering"]
osm = ['["office"="event_management"]', '["craft"="caterer"]']
overture = ["party_and_event_planning", "wedding_planning", "caterer", "balloon_service", "party_equipment_rental"]

[[categories]]
key = "interior_designer"
label = "Interior designer / Architect"
queries = ["interior designer", "architect"]
min_density = 2   # skip squares with almost no mapped businesses
match = ["interior", "interior designer", "architect", "design studio", "design agency", "decorator"]
osm = ['["office"="architect"]', '["shop"="interior_decoration"]', '["craft"="interior_designer"]']
overture = ["interior_design", "architectural_designer", "architect"]

[[categories]]
key = "landscaper"
label = "Landscaper / Gardener"
queries = ["landscaping company", "garden designer"]
min_density = 3
match = ["landscap*", "garden design*", "gardener", "gardening service", "lawn care"]
osm = ['["craft"="gardener"]', '["office"="landscape_architect"]']
overture = ["landscaping", "landscape_architect", "gardener"]

[[categories]]
key = "hotel"
label = "Hotel / Resort"
queries = ["hotel", "resort"]
match = ["hotel", "resort", "inn", "lodge", "guest house", "homestay", "serviced apartment", "villa"]
osm = ['["tourism"="hotel"]', '["tourism"="resort"]', '["tourism"="guest_house"]']
overture = ["hotel", "resort", "lodge", "lodging", "guest_house", "bed_and_breakfast", "motel"]

[[categories]]
key = "coworking"
label = "Coworking / Office space"
queries = ["coworking space"]
min_density = 5
match = ["coworking", "co-working", "shared office", "office space", "business center", "business centre", "virtual office"]
osm = ['["amenity"="coworking_space"]', '["office"="coworking"]']
overture = ["coworking_space"]

[[categories]]
key = "nursery_florist"
label = "Nursery / Florist (reseller)"
queries = ["plant nursery", "florist"]
min_density = 1
match = ["nursery", "nurseries", "florist", "flower*", "garden center", "garden centre", "plant shop", "plant store"]
osm = ['["shop"="garden_centre"]', '["shop"="florist"]']
overture = ["nursery_and_gardening_store", "florist", "garden_center", "flower_shop"]

[[categories]]
key = "salon_spa"
label = "Salon / Spa / Wellness"
queries = ["beauty salon", "spa", "wellness centre"]
min_density = 2
match = ["salon", "spa", "beauty", "wellness", "hair", "nail", "makeup", "make-up", "barber", "aesthetic", "skin", "massage", "ayurveda", "unisex"]
osm = ['["shop"="beauty"]', '["shop"="hairdresser"]', '["leisure"="spa"]']
overture = ["beauty_salon", "hair_salon", "nail_salon", "spa", "day_spa", "barber", "skin_care_clinic", "massage", "beauty_service", "personal_or_beauty_service"]

[[categories]]
key = "gym"
label = "Gym / Fitness"
queries = ["gym", "fitness centre"]
min_density = 2
match = ["gym", "fitness", "yoga", "pilates", "crossfit", "zumba", "workout", "health club", "martial art"]
osm = ['["leisure"="fitness_centre"]', '["leisure"="sports_centre"]']
overture = ["gym", "fitness_center", "yoga_studio", "pilates_studio", "martial_arts_club", "dance_studio"]

[[categories]]
key = "clinic"
label = "Clinic / Hospital"
queries = ["clinic", "hospital"]
min_density = 2
match = ["clinic", "hospital", "dental", "dentist", "nursing home", "diagnostic", "polyclinic", "healthcare", "health care", "medical", "eye care", "physiotherapy", "ivf", "maternity"]
osm = ['["amenity"="clinic"]', '["amenity"="hospital"]', '["amenity"="dentist"]', '["amenity"="doctors"]']
overture = ["clinic", "hospital", "dentist", "doctor", "medical_clinic", "diagnostic_center", "physiotherapist", "eye_care_clinic", "hospital"]

[[categories]]
key = "office"
label = "Corporate office"
queries = ["corporate office", "company office"]
min_density = 3
match = ["office", "corporate", "headquarters", "head office", "software", "technologies", "consultancy", "consultants", "solutions", "enterprise", "limited", "pvt", "llp"]
osm = ['["office"]']
overture = ["corporate_or_business_office", "corporate_office", "advertising_agency", "software_company", "it_service"]

[[categories]]
key = "real_estate"
label = "Real estate / Builder"
enabled = false   # set to true to include builders and property offices (model flats, lobbies)
queries = ["real estate developer", "property dealer"]
min_density = 3
match = ["real estate", "realtor", "realty", "builder", "developer", "construction", "property", "infrastructure", "estates", "projects", "housing", "group"]
osm = ['["office"="estate_agent"]']
overture = ["real_estate_agent", "real_estate_developer", "property_management", "real_estate_service", "construction_company"]

[[categories]]
key = "education"
label = "School / College"
enabled = false   # set to true to include schools and colleges
queries = ["college", "school"]
match = ["school", "college", "university", "institute", "academy"]
osm = ['["amenity"="school"]', '["amenity"="college"]', '["amenity"="university"]']
overture = ["school", "college_university", "university", "primary_school", "high_school", "preschool", "place_of_learning"]
